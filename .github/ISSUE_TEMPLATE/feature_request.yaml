---
name: "✨ Feature request"
description: Suggest a new feature for Kubara
title: "[Feature]: "
labels: ["feature request", "triage"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: |
        Describe the problem, who has it, and how they work around it today.
        Read the [contribution guide](https://github.com/kubara-io/kubara/blob/main/CONTRIBUTING.md) before filing an issue.
      placeholder: I need to ... but ...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Proposed solution
      description: Describe the behaviour you want. Alternatives are welcome when they would solve the problem differently.
      placeholder: Kubara should ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Other context
      description: Add screenshots, related issues, or prior art.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues
          required: true
