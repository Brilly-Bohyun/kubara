---
name: "🚀 Release"
description: Next release ticket (to be used by maintainers only)
title: "[Release]: next"
labels: ["release"]
assignees: []
body:
  - type: textarea
    id: plan
    attributes:
      label: "Release plan"
      description: Maintainers should complete this checklist before and after the release.
      value: |
        ---

        ## Before the release

        ### Review open pull requests
        - [ ] Are there any open PRs relevant for the release?
        - [ ] Resolve any questions about those PRs.

        ### Prepare the release contents
        - [ ] Trigger the Renovate workflow so pending dependency updates are visible.
        https://github.com/kubara-io/kubara/actions/workflows/renovate.yaml
        - [ ] Review Helm and Terraform updates.
        - [ ] Review Renovate pull requests.
        - [ ] Identify breaking changes and make sure commits mark them as such.
              https://www.conventionalcommits.org/en/v1.0.0/#commit-message-with--to-draw-attention-to-breaking-change
        - [ ] Review the changelog and compare the last release with `main`. Create follow-up issues for changes that need more work.
        - [ ] Test the merged changes locally or in a test cluster.

        ## Release day

        ### Run regression checks

        - [ ] Check [Docs](https://docs.kubara.io/next/) consistency and bootstrapping guide
        - [ ] Build the project.
        - [ ] Bootstrap and deploy a new test cluster.
        - [ ] Check Argo CD, login, running pods, and ingress access.
        - [ ] Test the upgrade path from the previous release.
        - [ ] Remove the test environment.

        ### Publish the release

        Create and push the release tag from `main`.

        Check the [release pipeline](https://github.com/kubara-io/kubara/actions/workflows/release.yaml)
        - [ ] Confirm GoReleaser built every target platform.
        - [ ] Confirm binaries, SBOMs, licenses, and the container image were published.
        - [ ] Confirm docs moved from `latest-dev` to `latest-stable`.
        - [ ] Send the [internal release notification](https://github.com/kubara-io/kubara/actions/workflows/release-announce-google-chat.yaml).
        - [ ] Announce the release in Slack.
        - [ ] Test `brew upgrade`.

        Notes for the next release:

    validations:
      required: true
