---
name: "🐛 Bug report"
description: Report a bug in Kubara
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: |
        Describe what happened, what you expected, and how it affects you.
        Read the [contribution guide](https://github.com/kubara-io/kubara/blob/main/CONTRIBUTING.md) before filing an issue.
      placeholder: Kubara did ... but I expected ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List clear steps to reproduce the issue.
      placeholder: |
        1. Run `kubara init`
        2. Apply config X
        3. Observe error Y
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Kubara version and any details needed to reproduce the issue.
      placeholder: |
        - Kubara version: v1.4.2
        - Kubernetes version: 1.28 (EKS)
        - Helm version: 3.13
        - Platform: kind
        - OS/Arch: Ubuntu 22.04 / amd64
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Logs or other context
      description: Paste relevant logs, screenshots, or links. Remove secrets.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues
          required: true
        - label: I can reproduce this with the latest version of Kubara
          required: false
