---
name: "❓ Question or support"
description: Ask a question or request clarification about Kubara
title: "[Question]: "
labels: ["question", "help wanted", "triage"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Question
      description: Explain what you are trying to do, then ask your question.
      placeholder: What would you like to know or clarify?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you tried
      description: Include the docs, commands, or configuration you checked. This helps us avoid sending you in circles.
      placeholder: I checked the docs at... and tried...

  - type: textarea
    id: additional
    attributes:
      label: Logs or other context
      description: Paste relevant logs, screenshots, or links. Remove secrets.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues
          required: true
        - label: I have checked the documentation
