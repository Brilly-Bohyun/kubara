---
name: "☂️ Change proposal"
description: Propose a substantial change to Kubara's design or behaviour
title: "[RFC]: "
labels: ["architecture", "triage"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What does the current behaviour prevent or make difficult? Who is affected?
      placeholder: The current ... makes it difficult to ...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Scope
      description: State what this proposal includes and what it deliberately leaves out. Keep related work separate if it does not need to ship with this change.
      value: |
        Includes:

        Excludes:

    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the design, affected areas, and trade-offs. Mention alternatives if they help explain the choice.
      value: |
        Design:

        Alternatives considered:

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues
          required: true
